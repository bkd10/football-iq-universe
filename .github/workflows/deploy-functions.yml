# Déploie les fonctions Edge (paiement Stripe) sur Supabase.
# Se lance à chaque modification de supabase/functions sur main, ou à la
# main (onglet Actions > Déployer les fonctions > Run workflow).
# Secret GitHub requis : SUPABASE_ACCESS_TOKEN (Supabase > Account >
# Access Tokens). Les clés Stripe restent dans Supabase, jamais ici.
name: Déployer les fonctions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gpirzqparsmckativtit
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - run: supabase functions deploy create-checkout --project-ref "$PROJECT_REF"
      - run: supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
