# Construit l'appli Android pour Google Play (fichier .aab).
# Lancement : onglet Actions > « Appli Android (Google Play) » > Run workflow,
# ou automatiquement à chaque envoi sur la branche de préparation Play Store.
# Le fichier se télécharge en bas de la page du lancement (« Artifacts »).
#
# Secrets GitHub (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64   la clé d'envoi (fichier .jks) encodée en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du fichier
#   ANDROID_KEY_ALIAS         nom de la clé (upload)
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
#   SUPABASE_ANON_KEY         clé publique « anon » (la même que Cloudflare)
#   SENTRY_DSN                facultatif
# Sans clé d'envoi, le fichier est construit pour tester mais Google Play le
# refusera (signé « debug »).
name: Appli Android (Google Play)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-4704rs]
    paths-ignore: ['supabase/**', '**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://gpirzqparsmckativtit.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Clé d'envoi Google Play
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pas de clé d'envoi : fichier de TEST seulement, refusé par Google Play."
            echo "signed=non" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_ANON_KEY absent : l'appli ne pourra pas se connecter."
          fi

      - run: flutter pub get

      - name: Construire le .aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Supprimer la clé du serveur
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: football-iq-${{ steps.key.outputs.signed == 'oui' && 'play-store' || 'TEST-non-publiable' }}-v${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
