project_id = "football-iq-universe"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:8080/**", "http://localhost:8080/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "200MiB"

[storage.buckets.videos]
public = true
file_size_limit = "200MiB"
allowed_mime_types = ["video/mp4", "video/quicktime", "video/webm"]

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.thumbnails]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

# Stripe appelle ce webhook sans session Supabase : la signature Stripe est
# vérifiée dans la fonction elle-même.
[functions.stripe-webhook]
verify_jwt = false
