name: football_iq_universe
description: "Football IQ Universe — La plateforme mondiale de développement du talent footballistique."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Modèles immuables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.5.9

  # Stockage local
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Vidéo
  video_player: ^2.9.1
  chewie: ^1.8.1
  image_picker: ^1.1.2
  video_compress: ^3.1.3
  # Lecteur <video> natif sur web (iPhone : lecture muette automatique).
  web: ^1.1.1

  # Images
  cached_network_image: ^3.3.1

  # Animations & UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  share_plus: ^12.0.2

  # Notifications push
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Analytics & monitoring
  sentry_flutter: ^8.9.0

  # Utilitaires
  dartz: ^0.10.1
  equatable: ^2.0.5
  intl: ^0.20.2
  uuid: ^4.4.2
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
