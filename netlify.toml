# Déploiement web sur Netlify — voir README.md, section "Déploiement web".
#
# Le build Netlify ne fournit pas le SDK Flutter par défaut : la commande
# ci-dessous le clone (version 3.44.7 figée, celle avec laquelle l'app est
# testée — pas "stable", qui change sans prévenir) avant de
# construire l'app. `flutter build web` PROD utilise `--dart-define`, pas
# `env/prod.json` (jamais commité, voir `.gitignore`) — les vraies valeurs
# (URL/clé anonyme Supabase) doivent être configurées comme variables
# d'environnement dans Netlify (Site configuration > Environment variables),
# jamais codées en dur ici.
[build]
  publish = "build/web"
  command = """
    git clone https://github.com/flutter/flutter.git --depth 1 -b 3.44.7 _flutter && \
    export PATH="$PATH:$(pwd)/_flutter/bin" && \
    flutter config --enable-web && \
    flutter pub get && \
    flutter build web --release \
      --dart-define=ENVIRONMENT=prod \
      --dart-define=SUPABASE_URL=$SUPABASE_URL \
      --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
      --dart-define=SENTRY_DSN=$SENTRY_DSN
  """

[build.environment]
  # Ne bloque pas le build si SENTRY_DSN n'est pas encore configuré —
  # `AppConfig.fromDartDefine()` traite une valeur vide comme "désactivé".
  SENTRY_DSN = ""

# App à page unique pilotée par GoRouter (chemins comme /feed, /profile...) :
# sans cette règle, recharger la page sur une route autre que "/" renvoie un
# 404 Netlify au lieu de laisser Flutter/GoRouter gérer la navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité : interdit d'afficher l'app dans une iframe d'un
# autre site (clickjacking), coupe le sniffing MIME et limite le Referer.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
